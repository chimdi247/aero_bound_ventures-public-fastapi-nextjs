global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Grafana-managed alert rules (observability/grafana/provisioning/alerting/)
# query this Prometheus datasource directly, so no separate
# rule_files/Alertmanager block is needed here -- see
# observability/README.md for why.

scrape_configs:
  # Prometheus's own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI backend HTTP metrics (prometheus-fastapi-instrumentator),
  # exposed at /metrics on the app's own port.
  - job_name: fastapi-backend
    static_configs:
      - targets: ["fastapi-app:80"]
        labels:
          service: backend-api

  # Metrics from every OpenTelemetry-auto-instrumented process
  # (fastapi-app and notification-worker), fanned out by the
  # otel-collector's own prometheus exporter -- see
  # observability/otel-collector/otel-collector-config.yaml.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Per-container CPU/memory/network utilization.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host (node) CPU/memory/disk utilization.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
