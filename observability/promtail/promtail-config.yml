server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers every container on the host via the Docker socket and
  # tails its stdout/stderr -- covers the backend, the notification
  # worker, the frontend, and the infra containers uniformly, instead
  # of only the backend's own log file as before.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Container name (strip the leading slash Docker's API adds).
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Compose service name, when available, is a friendlier label
      # than the raw container name.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
