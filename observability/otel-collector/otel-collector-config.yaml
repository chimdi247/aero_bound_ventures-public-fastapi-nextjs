receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Attaches container/host resource attributes so metrics/traces/logs
  # from every service can be sliced by them in Grafana.
  resource:
    attributes:
      - key: deployment.environment
        value: docker-compose
        action: upsert

exporters:
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> scraped by Prometheus (see
  # observability/prometheus/prometheus.yml's otel-collector job).
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> Loki's native OTLP ingestion endpoint. This is a second,
  # optional path for logs alongside Promtail (which tails every
  # container's stdout directly and is the primary path -- see
  # observability/promtail/promtail-config.yml); this one only carries
  # logs from processes that go through OpenTelemetry auto-instrumentation.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki, debug]

  telemetry:
    logs:
      level: info
